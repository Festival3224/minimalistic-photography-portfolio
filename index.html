<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Minimalistic photography portfolio showcasing selected visual work." />
    <title>Minimalistic Photography Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="style.css" />
</head>

  <body>
    <header class="site-header">
        <a class="logo" href="#home" aria-label="EKArt home">
            <span class="logo__strong">EK</span><span class="logo__light">Art</span>
        </a>
    
        <nav aria-label="Main navigation">
            <!-- <a href="#home">Home</a> -->
            <a href="#gallery">Gallery</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
        </header>
        
        <main id="home">
            <section class="hero">
                <p class="hero__intro">
                    Photography portfolio
                </p>
            </section>
        
            <section id="gallery" class="gallery-section">
                <h1 class="visually-hidden">EKArt Photography Portfolio</h1>
                <h2>Selected work</h2>
            
                <div class="gallery">
                    <figure class="gallery__item gallery__item--large">
                        <img src="images/photo-1.jpg" alt="Editorial portrait in natural light" />
                    </figure>
            
                    <figure class="gallery__item">
                        <img src="images/photo-2.jpg" alt="Street photography in an urban setting" />
                    </figure>
            
                    <figure class="gallery__item">
                        <img src="images/photo-3.jpg" alt="Minimal architectural detail" />
                    </figure>
            
                    <figure class="gallery__item gallery__item--wide">
                        <img src="images/photo-4.jpg" alt="Fashion portrait outdoors" />
                    </figure>
            
                    <figure class="gallery__item">
                        <img src="images/photo-5.jpg" alt="Black and white portrait" />
                    </figure>
            
                    <figure class="gallery__item">
                        <img src="images/photo-6.jpg" alt="Editorial still life composition" />
                    </figure>
                </div>
            </section>
            <section id="about" class="about-section">
                <h2>About</h2>
            </section>

      <section id="contact" class="contact-section">
        <h2>Contact</h2>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 Minimalistic Photography Portfolio</p>
    </footer>
  </body>
</html>
